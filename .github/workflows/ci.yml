name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Each check runs even if an earlier one failed, so a red build reports
      # everything that is wrong in one go instead of one thing per push.
      - name: Types
        if: always()
        run: npm run typecheck

      - name: Lint
        if: always()
        run: npm run lint

      # The pre-commit hook formats staged files; this catches anything that
      # reached the branch another way.
      - name: Format
        if: always()
        run: npm run format:check

      - name: Tests
        if: always()
        run: npm run test

      - name: Build
        if: always()
        run: npm run build

      # Needs the build above, so this one does not run when that failed.
      - name: Bundle budget
        run: npm run budget

      # Fails on any control that renders, looks pressable, and does nothing.
      - name: Dead controls
        if: always()
        run: python scripts/dead-controls.py
