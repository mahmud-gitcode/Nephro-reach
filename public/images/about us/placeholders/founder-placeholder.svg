<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <pattern id="gridF" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#94A3B8" stroke-width="0.5" stroke-opacity="0.2" />
    </pattern>
  </defs>

  <rect width="600" height="750" rx="20" fill="url(#bgGradF)" />
  <rect width="600" height="750" rx="20" fill="url(#gridF)" />
  <rect x="12" y="12" width="576" height="726" rx="16" fill="none" stroke="#0D9488" stroke-width="2" stroke-dasharray="8 8" stroke-opacity="0.4" />

  <g transform="translate(300, 340)">
    <!-- Avatar / Portrait Icon -->
    <circle cx="0" cy="-40" r="60" fill="#0D9488" fill-opacity="0.12" />
    <!-- User Head & Shoulders -->
    <circle cx="0" cy="-55" r="22" fill="none" stroke="#0D9488" stroke-width="4" />
    <path d="M -36 -15 C -36 -32 -20 -38 0 -38 C 20 -38 36 -32 36 -15" fill="none" stroke="#0D9488" stroke-width="4" stroke-linecap="round" />

    <text x="0" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0F172A">
      Founder Image Placeholder
    </text>
    <text x="0" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748B">
      Portrait • Aspect Ratio 4:5
    </text>
  </g>
</svg>
