<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="480" rx="16" fill="url(#grid)" />
  <rect x="8" y="8" width="1184" height="464" rx="12" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 8" stroke-opacity="0.5" />

  <!-- Center Card / Icon -->
  <g transform="translate(600, 210)">
    <circle cx="0" cy="-30" r="46" fill="#3B82F6" fill-opacity="0.12" />
    <!-- Image Icon -->
    <path d="M -22 -14 L 22 -14 C 26 -14 28 -12 28 -8 L 28 20 C 28 24 26 26 22 26 L -22 26 C -26 26 -28 24 -28 20 L -28 -8 C -28 -12 -26 -14 -22 -14 Z" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="-12" cy="-2" r="4.5" fill="#2563EB" />
    <path d="M 28 14 L 14 0 L -8 22 L -20 10 L -28 18" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Text -->
    <text x="0" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1E293B" letter-spacing="0.5">
      Hero Banner Image Placeholder
    </text>
    <text x="0" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#64748B">
      Recommended size: 1200 × 480 px
    </text>
  </g>
</svg>
